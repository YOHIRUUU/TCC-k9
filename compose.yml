#docker compose config
#docker compose up --build -d app

services:
  app:
    build: .
    container_name: flask-app
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: almoxarifado
      DB_USER: appuser
      DB_PASSWORD: app123
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: flask-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: almoxarifado
      MYSQL_USER: appuser
      MYSQL_PASSWORD: app123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  mysql_data:
