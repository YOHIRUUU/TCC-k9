# docker compose config
# docker compose up --build -d app


#
services:
  app:
    build: .
    container_name: flask-app
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: almoxarifado
      DB_USER: root
      DB_PASSWORD: ''
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

mysql:
  image: mysql:8.4
  container_name: flask-mysql
  environment:
    MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    MYSQL_DATABASE: almoxarifado
  volumes:
    - mysql_data:/var/lib/mysql
    - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
  healthcheck:
    test:
      - CMD-SHELL
      - 'mysqladmin ping -h 127.0.0.1 -uroot --silent'
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 40s
  restart: unless-stopped

volumes:
  mysql_data:
