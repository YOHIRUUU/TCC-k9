        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../static/style4.css">
    <link rel="icon" type="image/png" href="static/senai.png">

</head>

<body>
    <nav id="navbar" class="navbar navbar-expand-lg navbar-custom fixed-top">
        <li class="nav-item">
            <a class="nav-link" href="/"><img src="../static/senai2.png" id="logo"></a>
        </li>
        <div class="container-fluid">
            <a class="navbar-brand ms-2 fw-bold" href="" id="tituloEstoque">Almoxarifado</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/cadastrar">Cadastrar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/desbanir">Desbanir</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/perfil">Perfil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/usuarios">Usuários</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/logout">Logout</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/delete">Deletar conta</a>
                    </li>
                    <div class="btn-group">
                        <button type="button" id="dropdown" class="btn btn-outline-warning dropdown-toggle" data-bs-toggle="dropdown" data-bs-display="static" aria-expanded="false">
                            <img src="../static/usericon.png" id="imagemmenu">
                        </button>
                        <ul class="dropdown-menu dropdown-menu-lg-end">
                            <a href="/ABRAXAS">
                                <li><button class="dropdown-item" type="button">Estoque</button></li>

                            </a>
                            <a href="/remover">
                            <li><button class="dropdown-item" type="button">Remover</button></li>
                            </a>
                            <a href="movimentação">

                            </a>

                            </a>
                        </ul>
                    </div>
                </ul>
            </div>
        </div>
    </nav>
    <div class="caixa-fade">
        <div id="elemento">
            <div id="Adicionar-item">
                <h3 id="titulo">Banir</h3>
                <br>
                <form class="row g-3" action="/banir" method="POST" enctype="multipart/form-data">
                    <select class="form-select" name="email_selecionado" aria-label="Default select example">
                        <option value="" selected disabled>Escolha o Item</option>  
                        {% for item in registros %}
                            <option value="{{ item.email }}">{{ item.email }}</option>
                        {% endfor %}
                    </select>
                    <div class="col-12" id="Regiscao">
                        <button type="submit" class="btn btn-danger">
                            Banir
                        </button>
                    </div>
            </div>
        </div>
    </div>
    </form>
