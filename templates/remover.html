<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remover Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../static/style4.css">
    <link rel="icon" type="image/png" href="static/senai.png">

</head>

<body>
    <nav id="navbar" class="navbar navbar-expand-lg navbar-custom fixed-top">
        <li class="nav-item">
            <a class="nav-link" href="/"><img src="../static/senai2.png" id="logo"></a>
        </li>
        <div class="container-fluid">
            <a class="navbar-brand ms-2 fw-bold" href="#" id="tituloEstoque">Almoxarifado</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/cadastrar">Cadastrar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/adicionar">Adicionar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/movimentação">Movimentação</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/historico">Historico</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ABRAXAS">Estoque</a>
                    </li>
                    
                    <div class="btn-group">
                        <button type="button" id="dropdown" class="btn btn-outline-warning dropdown-toggle" data-bs-toggle="dropdown" data-bs-display="static" aria-expanded="false">
                            <img src="../static/manage.png" id="imagemmenu">
                        </button>
                        <ul class="dropdown-menu dropdown-menu-lg-end">
                            <a href="/perfil">
                                <li><button class="dropdown-item" type="button">Perfil</button></li>
                            </a>
                            <a href="/usuarios">
                            <li><button class="dropdown-item" type="button">Usuários</button></li>
                            </a>
                            <a href="/remover">
                            <li><button class="dropdown-item" type="button">Banir</button></li>
                            </a>
                            <a href="movimentação">
                            <li><button class="dropdown-item" type="button">Desbanir</button></li>
                            </a>
                            <li class="nav-item">
                                <div id="caxa">
                                    <button type="button" class="btn btn-danger" id="botstao">
                                        <a class="nav-link" href="/logout" title="Sair do Sistema">
                                            <img src="../static/account_circle.png" id="logo" alt="Logout">
                                        </a>
                                    </button>
                                </div>
                            </li>
                        </ul>
                    </div>
                </ul>
                <li class="nav-item">
                    <a class="nav-link">.</a>
                </li>
            </div>
        </div>
    </nav>

    <div class="caixa-fade">
        <div id="elemento">
            <div id="Adicionar-item">
                <h3 id="titulo">Remover</h3>
                <br>
                <form class="row g-3" action="/remover" method="POST" enctype="multipart/form-data">
                    <select class="form-select" name="item_selecionado" aria-label="Default select example">
                        <option value="" selected disabled>Escolha o Item</option>  
                        {% for item in registros %}
                            <option value="{{ item.id }}">{{ item.nome }}</option>
                        {% endfor %}
                    </select>
                    <div class="col-12" id="Regiscao">
                        <button type="submit" class="btn btn-primary">
                            Deletar
                        </button>
                    </div>
            </div>
        </div>
    </div>
    </form>
</body>

</html>
