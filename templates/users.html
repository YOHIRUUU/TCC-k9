<!DOCTYPE html>
<html lang="en">
<head>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js"></script>
    <link rel="stylesheet" href="../static/style4.css">
    <link rel="icon" type="image/png" href="static/senai.png">
</head>
</head>
<body>
    <div id="flex">
            {% for item in registros %}
        <div id="subflex">
            <div id="cardfx">
                <div id="divesquerda">
                    <img src="../static/userimagem.png" id="fotouser" alt="foto do user">
                </div>
                <div id="divdireita">
                    <div id="divdircima">
                        <h4 id="tituloEstoque">{{ item.nome }}</h4>
                        <p>{{ item.email }}</p>
                        {% if item.permisao == 1 %}
                        <p>administrador</p>
                        {% endif %}
                        {% if item.permisao == 0 %}
                        <p>usuário</p>
                        {% endif %}
                    </div>
                    <div id="divdirbaixo">
                        <button id="botaev">Histórico de ações</button>
                        <button id="botaev">Editar</button>
                    </div>
                </div>
            </div>
        </div>
            {% endfor %}
    </div>
</body>
</html>
